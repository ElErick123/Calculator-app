<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator app</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrapper">
    <div class="display">
      <p id="display-screen">0</p>
    </div>
    <div class="row" id="first-row">
      <button class="grey-button" onclick="addValueToDisplay('C')">C</button>
      <button class="grey-button" onclick="addValueToDisplay('%')">%</button>
      <button class="grey-button" onclick="addValueToDisplay('DEL')">DEL</button>
      <button class="orange-button" onclick="addValueToDisplay('/')">/</button>
    </div>
    <div class="row" id="second-row">
      <button class="black-button" onclick="addValueToDisplay('7')">7</button>
      <button class="black-button" onclick="addValueToDisplay('8')">8</button>
      <button class="black-button" onclick="addValueToDisplay('9')">9</button>
      <button class="orange-button" onclick="addValueToDisplay('+')">+</button>
    </div>
    <div class="row" id="third-row">
      <button class="black-button" onclick="addValueToDisplay('4')">4</button>
      <button class="black-button" onclick="addValueToDisplay('5')">5</button>
      <button class="black-button" onclick="addValueToDisplay('6')">6</button>
      <button class="orange-button" onclick="addValueToDisplay('-')">-</button>
    </div>
    <div class="row" id="fourth-row">
      <button class="black-button" onclick="addValueToDisplay('1')">1</button>
      <button class="black-button" onclick="addValueToDisplay('2')">2</button>
      <button class="black-button" onclick="addValueToDisplay('3')">3</button>
      <button class="orange-button" onclick="addValueToDisplay('*')">x</button>
    </div>
    <div class="row" id="fifth-row">
      <button class="black-button" onclick="addValueToDisplay('.')">.</button>
      <button class="black-button" onclick="addValueToDisplay('0')">0</button>
      <button class="orange-button" onclick="addValueToDisplay('=')">=</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
