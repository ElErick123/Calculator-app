<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator app</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrapper">
    <div class="display">
      <p>0</p>
    </div>
    <div class="row" id="first-row">
      <button class="grey-button">C</button>
      <button class="grey-button">%</button>
      <button class="grey-button">DEL</button>
      <button class="orange-button">/</button>
    </div>
    <div class="row" id="second-row">
      <button class="black-button">7</button>
      <button class="black-button">8</button>
      <button class="black-button">9</button>
      <button class="orange-button">+</button>
    </div>
    <div class="row" id="third-row">
      <button class="black-button">4</button>
      <button class="black-button">5</button>
      <button class="black-button">6</button>
      <button class="orange-button">-</button>
    </div>
    <div class="row" id="fourth-row">
      <button class="black-button">1</button>
      <button class="black-button">2</button>
      <button class="black-button">3</button>
      <button class="orange-button">x</button>
    </div>
    <div class="row" id="fifth-row">
      <button class="black-button">.</button>
      <button class="black-button">0</button>
      <button class="orange-button">=</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
